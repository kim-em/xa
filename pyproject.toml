[project]
name = "xa"
version = "0.1.0"
description = "External amygdala: know what is on fire without being asked"
requires-python = ">=3.11"
# Standard library only. The TUI is the one optional exception; everything on
# the read path stays importable without installing anything.
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.80"]

[project.scripts]
xa = "xa.cli:main"
xa-daemon = "xa.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
